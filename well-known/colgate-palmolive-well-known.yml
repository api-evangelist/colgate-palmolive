method: probed
source: >-
  Live HTTP probes of every host this record knows — the registrable corporate
  domain and www, the consumer brand hosts (colgate.com, hillspet.com,
  palmolive.com, colgateprofessional.com), the careers host and the investor
  host. Colgate-Palmolive publishes no API, so there is no baseURL host and no
  OpenAPI servers[] host to probe. All Colgate web properties sit behind Akamai;
  probes that returned 403 "Access Denied" were re-fetched with a full browser
  navigation header set (User-Agent, Accept, Sec-Fetch-*), and the status
  recorded below is the one that header set produced.

summary:
  documents_served: 0
  note: >-
    No /.well-known document of any kind is served on any Colgate-Palmolive
    host. NO WellKnown OR SecurityTxt POINTER IS EMITTED in apis.yml: every
    probed path either 404s or returns an HTML shell. This file records a
    measured absence, not a presence.

findings:
  - id: llms-txt-serves-parked-domain-boilerplate
    severity: notable
    host: www.colgatepalmolive.com
    detail: >-
      The corporate robots.txt declares "LLM-Policy: /llms.txt", pointing agents
      at an llms.txt the site does serve (HTTP 200, text/plain). The body is not
      about Colgate-Palmolive at all — it is GoDaddy aftermarket parked-domain
      boilerplate for a placeholder domain ("# dummy.com ... currently listed for
      sale on GoDaddy's aftermarket"). The same host's /.well-known/security.txt
      returns HTTP 200 with a one-line HTML shell that JavaScript-redirects to
      "/lander", the same parked-page pattern. Both look like template content
      that shipped to production. An agent following Colgate's own declared LLM
      policy is told the company's domain is for sale.
    evidence:
      - url: https://www.colgatepalmolive.com/robots.txt
        status: 200
        file: well-known/colgate-palmolive-robots.txt
      - url: https://www.colgatepalmolive.com/llms.txt
        status: 200
        file: well-known/colgate-palmolive-llms-txt-served.txt
      - url: https://www.colgatepalmolive.com/.well-known/security.txt
        status: 200
    consequence: >-
      Because the served llms.txt describes a different (placeholder) subject, it
      is treated as a MISS, not as a published LLMsTxt. The LLMsTxt pointer in
      apis.yml resolves to llms/colgate-palmolive-llms.txt, which API Evangelist
      generated from this repo and which is marked method: generated. Colgate's
      own file is preserved here verbatim as evidence only.
    provider_action: >-
      Replace /llms.txt with real content describing colgatepalmolive.com, or
      remove the LLM-Policy line from robots.txt. Replace or remove the
      /.well-known/security.txt lander shell and point it at the CP CSIRT intake
      (csirt@colpal.com, github.com/colpal/csirt) that already exists.

