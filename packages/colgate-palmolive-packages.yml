source: >-
  Registry searches against PyPI (pypi.org/pypi/<pkg>/json), npm
  (registry.npmjs.org) and the public GitHub API for the company's own verified
  organization, github.com/colpal ("Colgate-Palmolive Company",
  is_verified: true, 38 public repos). Versions and dates read from the GitHub
  Releases and Git tag metadata endpoints on 2026-09-05.

summary:
  package_count: 6
  official_count: 6
  api_client_count: 0
  note: >-
    NONE OF THESE IS AN API CLIENT SDK. Colgate-Palmolive publishes no public
    API (see apis.yml x-coverage), so there is nothing for a client library to
    wrap. What the company does publish is internal platform tooling it chose to
    open-source: one Python data-engineering library and a set of GitHub Actions
    used by its own CI. They are recorded here because they are genuinely
    first-party published software with real, dated releases — but NO `SDKs`
    POINTER IS EMITTED in apis.yml, because sdk_count is a count of API client
    libraries and these would inflate it with something a consumer of a
    Colgate-Palmolive API could not use.

