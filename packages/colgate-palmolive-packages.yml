packages:
  - name: dataeng-container-tools
    language: python
    kind: library
    purpose: >-
      Tooling for Colgate-Palmolive's data-engineering containers — GCS and
      Snowflake IO helpers, secret handling, and CLI argument plumbing for
      containerized Airflow jobs.
    official: true
    api_client: false
    registry: github-releases
    version: v1.0.3
    published: '2026-07-29'
    repository: https://github.com/colpal/dataEng-container-tools
    install: pip install git+https://github.com/colpal/dataEng-container-tools@v1.0.3
    license: MIT
    maintainer: CP DE Team <airflow_app_owners@colpal.com>
    note: >-
      The most actively maintained public artifact Colgate-Palmolive ships:
      three releases in ten days in July 2026 and a Python floor of >=3.10.
      Deliberately NOT on PyPI — pyproject.toml sets its `download` URL to the
      repository's own releases page, so consumers install from a git ref. The
      package name is unclaimed on PyPI, which is a supply-chain gap the company
      may want to close defensively.

