  reason: no-developer-program
  detail: >-
    Colgate-Palmolive ships consumer products, not software: developer.colgatepalmolive.com
    and api.colgatepalmolive.com do not resolve at all, and no OpenAPI, GraphQL, AsyncAPI,
    .proto or WSDL exists on any of its seven public hosts or in its own verified GitHub
    org (github.com/colpal, 38 public repos, all internal CI tooling). Its real
    machine-to-machine footprint is retail EDI and supplier onboarding routed to
    third-party platforms (Taulia, Tungsten), which belong to those vendors rather than
    to Colgate-Palmolive.
